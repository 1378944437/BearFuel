name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          VERSION_NAME="${APP_VERSION%%+*}"
          test "v${VERSION_NAME}" = "${GITHUB_REF_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Restore release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bearfuel-release.jks"

      - name: Build signed arm64 APK
        env:
          BEARFUEL_KEYSTORE_PATH: ${{ runner.temp }}/bearfuel-release.jks
          BEARFUEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BEARFUEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BEARFUEL_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Prepare release files
        shell: bash
        run: |
          APK="BearFuel-v${VERSION_NAME}-arm64-v8a-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$APK" "$APK.sha256"
          --title "BearFuel ${VERSION_NAME}"
          --generate-notes
